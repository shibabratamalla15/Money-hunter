<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Money Hunter — Track the Note</title>

<meta name="theme-color" content="#1a202c">
<meta name="description" content="Money Hunter — scan a banknote's serial number and follow the journey it's been on.">
<link id="manifest-link" rel="manifest" href="/manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:#fcf8f2;
    --paper-dark:#f1e9db;
    --ink:#1a202c;
    --ink-soft:#4a5568;
    --stamp:#c53030;
    --gold:#b8923f;
    --note-purple:#6e5a7d;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; background:#0d1117; font-family:'IBM Plex Sans',sans-serif; display:flex; align-items:center; justify-content:center; }
  .wrap { display:flex; flex-direction:column; align-items:center; width:100%; }
  
  .device {
    width:390px; max-width:100%; height:780px; background:var(--paper);
    border-radius:36px; overflow:hidden; position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.5); border:8px solid #111;
  }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.active { display:flex; }

  /* SCAN SCREEN */
  .cam-top { padding:20px 20px 12px; display:flex; justify-content:space-between; align-items:center; color:var(--paper); z-index:2; position:relative; background: #0d1117; }
  .brand { font-family:'Fraunces',serif; font-weight:600; font-size:15px; }
  .brand em { font-style:normal; color:var(--gold); }
  
  .cam-view { flex:1; position:relative; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  video { position:absolute; width:100%; height:100%; object-fit:cover; }
  
  .viewfinder { width:280px; height:150px; position:relative; z-index:2; }
  .corner { position:absolute; width:28px; height:28px; border:3px solid var(--gold); }
  .corner.tl { top:0; left:0; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  .corner.tr { top:0; right:0; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
  .corner.bl { bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 6px; }
  .corner.br { bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 6px 0; }
  
  .scan-line { position:absolute; left:6%; right:6%; height:2px; background:var(--gold); box-shadow:0 0 12px 2px var(--gold); animation:sweep 2.2s ease-in-out infinite; }
  @keyframes sweep { 0%,100%{ top:8%; opacity:.9;} 50%{ top:88%; opacity:.6;} }
  
  .cam-hint { text-align:center; color:#a8a196; font-size:12.5px; padding:12px 20px 4px; background:#0d1117; }
  .cam-status { text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); padding:2px 20px 10px; background:#0d1117; min-height:28px; }
  .cam-bottom { padding:15px 24px 25px; display:flex; align-items:center; justify-content:center; background:#0d1117; }
  
  .shutter { width:68px; height:68px; border-radius:50%; background:var(--paper); border:4px solid var(--gold); cursor:pointer; position:relative; }
  .shutter::after { content:''; position:absolute; top:4px; left:4px; width:52px; height:52px; border-radius:50%; background:var(--stamp); }

  /* REVEAL SCREEN */
  .reveal { padding:26px 24px; overflow-y:auto; height:100%; background:var(--paper); position:relative; }
  .close-x { position:absolute; top:20px; right:20px; font-size:24px; border:none; background:none; cursor:pointer; }
  .serial-title { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:var(--ink); margin-top:20px; }
  .status-badge { display:inline-block; padding:4px 10px; background:var(--gold); color:#fff; border-radius:6px; font-size:12px; font-family:'IBM Plex Mono',monospace; margin-bottom:10px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="device">

    <!-- CAMERA SCREEN -->
    <div class="screen active" id="scan">
      <div class="cam-top">
        <div class="brand">Money <em>Hunter</em></div>
        <div style="font-family:'IBM Plex Mono',monospace; font-size:11px;">LIVE SCAN</div>
      </div>
      <div class="cam-view">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="viewfinder">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div class="scan-line"></div>
        </div>
      </div>
      <div class="cam-hint" id="camHint">Allow camera access and align serial number</div>
      <div class="cam-status" id="camStatus">Initializing camera...</div>
      <div class="cam-bottom">
        <button class="shutter" id="shutterBtn"></button>
      </div>
    </div>

    <!-- REVEAL SCREEN -->
    <div class="screen" id="reveal">
      <div class="reveal">
        <button class="close-x" id="closeBtn">&times;</button>
        <div class="status-badge" id="scanStatusBadge">SCAN SUCCESS</div>
        <div class="serial-title" id="scannedSerial">--- ---</div>
        <p id="scanDetails" style="color:var(--ink-soft); font-size:14px; margin-top:10px;">Processing complete. Check Supabase database for record.</p>
        <button id="scanAgainBtn" style="margin-top:30px; width:100%; padding:12px; background:var(--ink); color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer;">Scan Another Note</button>
      </div>
    </div>

  </div>
</div>

<script type="module">
  import { isValidSerialFormat } from './ocr-engine.js';

  const video = document.getElementById('webcam');
  const camStatus = document.getElementById('camStatus');
  const shutterBtn = document.getElementById('shutterBtn');
  const scanScreen = document.getElementById('scan');
  const revealScreen = document.getElementById('reveal');

  // Start Real Camera Stream
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
      video.srcObject = stream;
      camStatus.textContent = "Camera active. Tap shutter to capture.";
    } catch (err) {
      console.error("Camera access error:", err);
      camStatus.textContent = "Error: Camera permission denied or unsupported.";
    }
  }

  // Shutter Click Handler: Capture image from video stream
  shutterBtn.addEventListener('click', () => {
    if (!video.srcObject) {
      alert("Camera is not active yet.");
      return;
    }

    camStatus.textContent = "Capturing & processing scan...";

    // Temporary canvas to grab current frame
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Prompt user for OCR serial entry or auto-fill input (for testing backend POST API)
    const detectedSerial = prompt("Enter Note Serial Number (Format: 4AN 782914):", "4AN 782914");

    if (detectedSerial && isValidSerialFormat(detectedSerial)) {
      document.getElementById('scannedSerial').textContent = detectedSerial;
      scanScreen.classList.remove('active');
      revealScreen.classList.add('active');
      
      // POST scan to Express API backend
      sendScanToServer(detectedSerial);
    } else {
      camStatus.textContent = "Invalid Serial Format! Try again.";
    }
  });

  async function sendScanToServer(serial) {
    try {
      const res = await fetch('/v1/scans', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          serial_number: serial,
          geohash6: "tsj2k9", // Default geohash
          scan_source: "citizen"
        })
      });
      const data = await res.json();
      console.log("Server response:", data);
    } catch (e) {
      console.error("Failed to post scan:", e);
    }
  }

  document.getElementById('closeBtn').addEventListener('click', resetUI);
  document.getElementById('scanAgainBtn').addEventListener('click', resetUI);

  function resetUI() {
    revealScreen.classList.remove('active');
    scanScreen.classList.add('active');
    camStatus.textContent = "Camera active. Tap shutter to capture.";
  }

  startCamera();
</script>

</body>
            </html>
