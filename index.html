<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Hunter</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.min.js@5/dist/tesseract.min.js"></script>
<style>
    :root { --paper: #fcf8f2; --ink: #1a202c; --gold: #b8923f; --bg-dark: #0d1117; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; font-family: sans-serif; background: var(--bg-dark); overflow: hidden; }
    
    .screen { display: none; height: 100%; width: 100%; position: absolute; top:0; left:0; }
    .screen.active { display: flex; flex-direction: column; z-index: 10; }

    /* Camera & Overlay (Fix for Gray Line) */
    .cam-view { flex: 1; position: relative; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    .viewfinder { 
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 80%; max-width: 300px; height: 140px;
        border: 3px dashed var(--gold); border-radius: 12px;
        box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); /* Fixed: Overlay logic */
    }

    /* UI Elements */
    .ui-bottom { background: var(--bg-dark); color: #fff; padding: 20px; text-align: center; }
    #shutterBtn { width: 70px; height: 70px; border-radius: 50%; background: white; border: 4px solid var(--gold); cursor: pointer; }
    
    /* Result Screen */
    .reveal { background: var(--paper); padding: 30px; color: var(--ink); height: 100%; overflow-y: auto; }
    .trail-item { padding: 10px 0; border-bottom: 1px solid #ccc; }
</style>
</head>
<body>

    <!-- SCREEN 1: SCANNER -->
    <div class="screen active" id="scan">
        <div class="cam-view">
            <video id="webcam" autoplay playsinline muted></video>
            <div class="overlay"><div class="viewfinder"></div></div>
        </div>
        <div class="ui-bottom">
            <div id="camStatus">Initializing...</div>
            <button id="shutterBtn"></button>
        </div>
    </div>

    <!-- SCREEN 2: RESULT -->
    <div class="screen" id="reveal">
        <div class="reveal">
            <h2 id="serialDisplay">---</h2>
            <div id="statusBadge">Checking...</div>
            <div id="trailList"></div>
            <button onclick="resetApp()">Scan Again</button>
        </div>
    </div>

<script>
    const video = document.getElementById('webcam');
    const shutterBtn = document.getElementById('shutterBtn');
    const camStatus = document.getElementById('camStatus');
    const scanScreen = document.getElementById('scan');
    const revealScreen = document.getElementById('reveal');

    // Load Camera
    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            camStatus.textContent = "Camera Ready.";
        } catch (e) { camStatus.textContent = "Camera Access Denied."; }
    }

    // Process & OCR
    shutterBtn.addEventListener('click', async () => {
        shutterBtn.disabled = true;
        camStatus.textContent = "Scanning...";

        // Native Crop (No OpenCV)
        const canvas = document.createElement('canvas');
        canvas.width = 400; canvas.height = 200;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, video.videoWidth*0.2, video.videoHeight*0.4, video.videoWidth*0.6, video.videoHeight*0.2, 0,0, 400, 200);
        
        const imgData = canvas.toDataURL('image/jpeg', 0.8);

        try {
            const result = await Tesseract.recognize(imgData, 'eng');
            showResult(result.data.text.replace(/[^A-Z0-9]/g, ''));
        } catch (e) { 
            camStatus.textContent = "Scan Failed."; 
            shutterBtn.disabled = false;
        }
    });

    function showResult(serial) {
        scanScreen.classList.remove('active');
        revealScreen.classList.add('active');
        document.getElementById('serialDisplay').textContent = serial || "Not Detected";
    }

    function resetApp() {
        revealScreen.classList.remove('active');
        scanScreen.classList.add('active');
        shutterBtn.disabled = false;
        camStatus.textContent = "Ready.";
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
