<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Android App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        header {
            background-color: #6200ee;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Main App Body */
        main {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #6200ee;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .btn:active {
            background-color: #3700b3;
        }

        /* Bottom Navigation Bar */
        nav {
            display: flex;
            justify-content: space-around;
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 10px 0;
        }

        .nav-item {
            text-decoration: none;
            color: #777;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-item.active {
            color: #6200ee;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        My App
    </header>

    <main>
        <div class="card">
            <h2>Welcome!</h2>
            <p style="margin-top: 8px; color: #666;">Yeh Android WebView ke liye tayar kiya gaya index.html file hai.</p>
        </div>

        <button class="btn" onclick="handleClick()">Click Me</button>
    </main>

    <nav>
        <a href="#" class="nav-item active">Home</a>
        <a href="#" class="nav-item">Search</a>
        <a href="#" class="nav-item">Profile</a>
    </nav>

    <script>
        function handleClick() {
            alert("App fully functional hai!");
        }
    </script>
</body>
</html>
