<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Money Hunter — Track the Note</title>

<meta name="theme-color" content="#1a202c">
<meta name="description" content="Money Hunter — scan a banknote's serial number and follow the journey it's been on.">
<link id="manifest-link" rel="manifest" href="/manifest.json">

<!-- Fonts & Tesseract OCR Library -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.min.js@5/dist/tesseract.min.js"></script>

<style>
  :root {
    --paper:#fcf8f2;
    --paper-dark:#f1e9db;
    --ink:#1a202c;
    --ink-soft:#4a5568;
    --stamp:#c53030;
    --gold:#b8923f;
    --green:#2f7a4a;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; background:#0d1117; font-family:'IBM Plex Sans',sans-serif; display:flex; align-items:center; justify-content:center; }
  .wrap { display:flex; flex-direction:column; align-items:center; width:100%; }
  
  .device {
    width:390px; max-width:100%; height:780px; background:var(--paper);
    border-radius:36px; overflow:hidden; position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.5); border:8px solid #111;
  }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.active { display:flex; }

  /* SCAN SCREEN */
  .cam-top { padding:20px 20px 12px; display:flex; justify-content:space-between; align-items:center; color:var(--paper); z-index:2; position:relative; background: #0d1117; }
  .brand { font-family:'Fraunces',serif; font-weight:600; font-size:15px; }
  .brand em { font-style:normal; color:var(--gold); }
  
  .cam-view { flex:1; position:relative; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  video { position:absolute; width:100%; height:100%; object-fit:cover; }
  
  .viewfinder { width:280px; height:140px; position:relative; z-index:2; }
  .corner { position:absolute; width:28px; height:28px; border:3px solid var(--gold); }
  .corner.tl { top:0; left:0; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  .corner.tr { top:0; right:0; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
  .corner.bl { bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 6px; }
  .corner.br { bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 6px 0; }
  
  .scan-line { position:absolute; left:6%; right:6%; height:2px; background:var(--gold); box-shadow:0 0 12px 2px var(--gold); animation:sweep 2.2s ease-in-out infinite; }
  @keyframes sweep { 0%,100%{ top:8%; opacity:.9;} 50%{ top:88%; opacity:.6;} }
  
  .cam-hint { text-align:center; color:#a8a196; font-size:12.5px; padding:12px 20px 4px; background:#0d1117; }
  .cam-status { text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); padding:2px 20px 10px; background:#0d1117; min-height:34px; }
  .cam-bottom { padding:15px 24px 25px; display:flex; align-items:center; justify-content:center; background:#0d1117; }
  
  .shutter { width:68px; height:68px; border-radius:50%; background:var(--paper); border:4px solid var(--gold); cursor:pointer; position:relative; }
  .shutter::after { content:''; position:absolute; top:4px; left:4px; width:52px; height:52px; border-radius:50%; background:var(--stamp); }
  .shutter:disabled { opacity:0.4; cursor:not-allowed; }

  /* REVEAL & TRAIL SCREEN */
  .reveal { padding:26px 24px; overflow-y:auto; height:100%; background:var(--paper); position:relative; }
  .close-x { position:absolute; top:20px; right:20px; font-size:24px; border:none; background:none; cursor:pointer; color:var(--ink-soft); }
  .status-badge { display:inline-block; padding:4px 10px; background:var(--green); color:#fff; border-radius:6px; font-size:11px; font-family:'IBM Plex Mono',monospace; letter-spacing:0.05em; font-weight:600; }
  .serial-title { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:var(--ink); margin-top:14px; }
  
  .stamp-zone { margin:20px 0 15px; display:flex; justify-content:center; }
  .stamp { width:110px; height:110px; border-radius:50%; border:3px solid var(--stamp); color:var(--stamp); display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Fraunces',serif; text-align:center; transform:rotate(-8deg); }
  .stamp .st-1 { font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
  .stamp .st-2 { font-size:15px; font-weight:600; margin:2px 0; }

  .headline { font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--ink); text-align:center; margin:10px 0 4px; }
  .headline em { font-style:normal; color:var(--stamp); }
  .subline { text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:20px; }

  .divider { border:none; border-top:1px dashed rgba(26,32,44,.25); margin:18px 0; }
  .trail-title { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:12px; }
  .trail { position:relative; padding-left:6px; }
  .trail-item { display:flex; gap:14px; position:relative; padding-bottom:18px; }
  .trail-item:last-child { padding-bottom:0; }
  .trail-item::before { content:''; position:absolute; left:9px; top:20px; bottom:0; width:1px; border-left:2px dotted rgba(197,48,48,.4); }
  .trail-item:last-child::before { display:none; }
  .dot { width:20px; height:20px; border-radius:50%; background:var(--paper); border:2px solid var(--stamp); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--stamp); font-weight:700; }
  .dot.now { background:var(--stamp); color:var(--paper); }
  .trail-city { font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--ink); }
  .trail-meta { font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }

  .btn-scan { margin-top:25px; width:100%; padding:14px; background:var(--ink); color:#fff; border:none; border-radius:10px; font-weight:600; cursor:pointer; font-size:14px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="device">

    <!-- CAMERA SCANNER SCREEN -->
    <div class="screen active" id="scan">
      <div class="cam-top">
        <div class="brand">Money <em>Hunter</em></div>
        <div style="font-family:'IBM Plex Mono',monospace; font-size:11px;">LIVE OCR</div>
      </div>
      <div class="cam-view">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="viewfinder">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div class="scan-line"></div>
        </div>
      </div>
      <div class="cam-hint" id="camHint">Align note's serial number inside the frame</div>
      <div class="cam-status" id="camStatus">Initializing camera & GPS...</div>
      <div class="cam-bottom">
        <button class="shutter" id="shutterBtn" aria-label="Scan Note"></button>
      </div>
    </div>

    <!-- REVEAL NOTE STATUS & TRAIL SCREEN -->
    <div class="screen" id="reveal">
      <div class="reveal">
        <button class="close-x" id="closeBtn">&times;</button>
        <div class="status-badge" id="scanStatusBadge">FIRST SIGHTING</div>
        <div class="serial-title" id="scannedSerial">--- ---</div>

        <div class="stamp-zone">
          <div class="stamp" id="stampText">
            <div class="st-1">STATUS</div>
            <div class="st-2">VERIFIED</div>
          </div>
        </div>

        <div class="headline" id="revealHeadline">Checking <em>Status...</em></div>
        <div class="subline" id="revealSubline">Fetching note journey trail...</div>

        <hr class="divider">
        <div class="trail-title">Note Journey Trail</div>
        <div class="trail" id="trailList"></div>

        <button class="btn-scan" id="scanAgainBtn">Scan Another Note</button>
      </div>
    </div>

  </div>
</div>

<script type="module">
  import { processFrame, isValidSerialFormat } from './ocr-engine.js';

  const video = document.getElementById('webcam');
  const camStatus = document.getElementById('camStatus');
  const shutterBtn = document.getElementById('shutterBtn');
  const scanScreen = document.getElementById('scan');
  const revealScreen = document.getElementById('reveal');

  let currentLocationLabel = "India";

  // Get Real GPS Location
  function detectRealLocation() {
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
          const data = await res.json();
          const city = data.city || data.locality || data.localityInfo?.administrative[2]?.name || "Local Area";
          const state = data.principalSubdivision || "";
          currentLocationLabel = `${city}${state ? ', ' + state : ''}`;
        } catch (e) {
          currentLocationLabel = "India";
        }
      }, () => {
        currentLocationLabel = "Location Permission Denied";
      });
    }
  }

  // Camera Setup
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
      video.srcObject = stream;
      camStatus.textContent = "Camera Ready. Align serial & tap shutter.";
    } catch (err) {
      camStatus.textContent = "Error: Camera access denied.";
    }
  }

  // Shutter Handler
  shutterBtn.addEventListener('click', async () => {
    if (!video.srcObject) return;

    shutterBtn.disabled = true;
    camStatus.textContent = "Scanning frame for valid RBI serial...";

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    let extractedSerial = null;

    try {
      const result = await processFrame(canvas);
      if (result && result.formatted && isValidSerialFormat(result.formatted)) {
        extractedSerial = result.formatted;
      }
    } catch (e) {
      console.warn("OCR Read Warning:", e);
    }

    // STRICT CHECK: No fake prompt auto-fill!
    if (!extractedSerial) {
      camStatus.textContent = "❌ No valid serial number found! Align note properly.";
      shutterBtn.disabled = false;
      return; 
    }

    camStatus.textContent = `Found: ${extractedSerial}. Sending scan...`;
    await sendScanToServer(extractedSerial);
    shutterBtn.disabled = false;
  });

  // Server Communication
  async function sendScanToServer(serial) {
    try {
      const res = await fetch('/v1/scans', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          serial_number: serial,
          geohash6: "tsj2k9",
          city_label: currentLocationLabel,
          scan_source: "citizen"
        })
      });

      const data = await res.json();
      if (data.error) {
        alert("Server Error: " + data.error);
        return;
      }
      renderStatusScreen(data);
    } catch (e) {
      alert("Network Error while posting scan.");
    }
  }

  // UI Renderer
  function renderStatusScreen(data) {
    scanScreen.classList.remove('active');
    revealScreen.classList.add('active');

    document.getElementById('scannedSerial').textContent = data.serial_number;
    
    const trail = data.trail || [];
    const totalScans = trail.length || 1;
    const isFirst = data.status === 'first' || totalScans <= 1;

    const badge = document.getElementById('scanStatusBadge');
    const headline = document.getElementById('revealHeadline');
    const subline = document.getElementById('revealSubline');
    const stampText = document.getElementById('stampText');

    if (isFirst) {
      badge.textContent = "FIRST SIGHTING";
      badge.style.background = "#2f7a4a";
      stampText.style.borderColor = "#2f7a4a";
      stampText.style.color = "#2f7a4a";
      stampText.innerHTML = `<div class="st-1">FIRST</div><div class="st-2">SIGHTING</div>`;
      headline.innerHTML = "You found it <em>first!</em>";
      subline.textContent = "This is the earliest recorded scan of this note.";
    } else {
      badge.textContent = `REPEAT SCAN (#${totalScans})`;
      badge.style.background = "#b8923f";
      stampText.style.borderColor = "#c53030";
      stampText.style.color = "#c53030";
      stampText.innerHTML = `<div class="st-1">SCAN</div><div class="st-2">NO. ${totalScans}</div>`;
      headline.innerHTML = "This note has <em>history.</em>";
      subline.textContent = `Scanned ${totalScans - 1} time(s) before yours across India!`;
    }

    // Trail Renderer
    const trailContainer = document.getElementById('trailList');
    trailContainer.innerHTML = '';

    trail.forEach((item, idx) => {
      const isCurrent = idx === trail.length - 1;
      const dateObj = new Date(item.scanned_at);
      const formattedDate = dateObj.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      const formattedTime = dateObj.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

      const itemDiv = document.createElement('div');
      itemDiv.className = 'trail-item';
      itemDiv.innerHTML = `
        <div class="dot ${isCurrent ? 'now' : ''}">${isCurrent ? '•' : idx + 1}</div>
        <div>
          <div class="trail-city">${item.city_label || 'India'}</div>
          <div class="trail-meta">${formattedDate} at ${formattedTime}</div>
        </div>
      `;
      trailContainer.appendChild(itemDiv);
    });
  }

  function resetScanner() {
    revealScreen.classList.remove('active');
    scanScreen.classList.add('active');
    camStatus.textContent = "Camera Ready. Align serial & tap shutter.";
  }

  document.getElementById('closeBtn').addEventListener('click', resetScanner);
  document.getElementById('scanAgainBtn').addEventListener('click', resetScanner);

  startCamera();
  detectRealLocation();
</script>

</body>
  </html>
