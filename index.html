<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Hunter | Fast Capture</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; }
        #webcam { width: 100%; height: 100%; object-fit: cover; }
        .ui { position: absolute; bottom: 30px; width: 100%; text-align: center; }
        #captureBtn { padding: 20px 40px; background: #b8923f; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
        .overlay { position: absolute; inset: 0; pointer-events: none; border: 3px dashed #b8923f; margin: 20%; }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <div class="overlay"></div>
    <div class="ui">
        <div id="msg">Ready to capture...</div>
        <button id="captureBtn">SNAP & SEND</button>
    </div>

<script>
    const video = document.getElementById('webcam');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('captureBtn');

    // 1. Camera Init
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => video.srcObject = stream)
        .catch(e => msg.textContent = "Camera Error!");

    // 2. Capture and Send Logic
    btn.addEventListener('click', async () => {
        btn.disabled = true;
        msg.textContent = "Capturing...";

        // Snapshot
        const canvas = document.createElement('canvas');
        canvas.width = 640; canvas.height = 360; // Lightweight resolution
        canvas.getContext('2d').drawImage(video, 0, 0, 640, 360);
        const imageData = canvas.toDataURL('image/jpeg', 0.6); // 60% quality

        // Get Location
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const data = {
                image: imageData,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                time: new Date().toISOString()
            };

            // Send to Server
            msg.textContent = "Sending to Server...";
            try {
                const response = await fetch('https://YOUR_SERVER_ENDPOINT/upload', {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'application/json' }
                });
                msg.textContent = "Sent Successfully!";
                setTimeout(() => btn.disabled = false, 2000);
            } catch(e) {
                msg.textContent = "Upload Failed: " + e.message;
                btn.disabled = false;
            }
        }, (e) => {
            msg.textContent = "Location required!";
            btn.disabled = false;
        });
    });
</script>
</body>
</html>
