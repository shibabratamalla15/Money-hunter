<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Hunter | Core App</title>
    
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --paper: #fcf8f2; --ink: #1a202c; --gold: #b8923f; --bg-dark: #0d1117; --green: #2f7a4a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-dark); font-family: sans-serif; height: 100vh; overflow: hidden; }

        .screen { display: none; height: 100vh; width: 100%; position: absolute; top:0; left:0; }
        .screen.active { display: flex; flex-direction: column; z-index: 10; }

        /* Camera Screen */
        .cam-view { flex: 1; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; inset: 0; pointer-events: none; display: flex; justify-content: center; align-items: center; }
        .viewfinder { width: 250px; height: 100px; border: 3px dashed var(--gold); border-radius: 8px; }
        .ui-bottom { background: var(--bg-dark); color: #fff; padding: 25px; text-align: center; }
        #captureBtn { padding: 16px 36px; background: var(--gold); color: #000; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
        #msg { color: var(--gold); font-size: 13px; margin-bottom: 12px; font-family: monospace; }

        /* Reveal / Result Screen */
        .reveal { background: var(--paper); padding: 30px; color: var(--ink); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .status-badge { display: inline-block; padding: 6px 14px; background: var(--green); color: #fff; border-radius: 6px; font-size: 12px; font-weight: 700; margin-bottom: 15px; }
        .timestamp { font-family: monospace; font-size: 13px; color: #666; margin-top: 10px; }
        .btn-scan { background: var(--ink); color: #fff; padding: 14px 28px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 30px; }
    </style>
</head>
<body>

    <!-- SCREEN 1: SCANNER -->
    <div class="screen active" id="scanScreen">
        <div class="cam-view">
            <video id="webcam" autoplay playsinline muted></video>
            <div class="overlay"><div class="viewfinder"></div></div>
        </div>
        <div class="ui-bottom">
            <div id="msg">Ready to scan note...</div>
            <button id="captureBtn">SNAP & SAVE</button>
        </div>
    </div>

    <!-- SCREEN 2: REVEAL / RESULT -->
    <div class="screen" id="revealScreen">
        <div class="reveal">
            <div class="status-badge">SUCCESSFULLY SAVED</div>
            <h2>Note Captured & Logged</h2>
            <div class="timestamp" id="scanTime">---</div>
            <button class="btn-scan" onclick="resetApp()">Scan Another Note</button>
        </div>
    </div>

<script>
    // Supabase Configuration
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co"; // Replace with your URL
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";         // Replace with your Key
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const video = document.getElementById('webcam');
    const msg = document.getElementById('msg');
    const captureBtn = document.getElementById('captureBtn');
    const scanScreen = document.getElementById('scanScreen');
    const revealScreen = document.getElementById('revealScreen');

    // Init Camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => video.srcObject = stream)
        .catch(e => msg.textContent = "Camera Error!");

    // Capture & Save Trigger
    captureBtn.addEventListener('click', async () => {
        captureBtn.disabled = true;
        msg.textContent = "Capturing image...";

        // 1. Snapshot creation
        const canvas = document.createElement('canvas');
        canvas.width = 640; canvas.height = 360;
        canvas.getContext('2d').drawImage(video, 0, 0, 640, 360);
        const imageBase64 = canvas.toDataURL('image/jpeg', 0.6);

        // 2. Location fetch
        msg.textContent = "Getting Location...";
        navigator.geolocation.getCurrentPosition(async (pos) => {
            msg.textContent = "Saving to database...";

            try {
                const scanTime = new Date().toISOString();
                
                // 3. Supabase Insert
                const { error } = await supabaseClient
                    .from('scans')
                    .insert([
                        {
                            image_data: imageBase64,
                            latitude: pos.coords.latitude,
                            longitude: pos.coords.longitude,
                            scanned_at: scanTime
                        }
                    ]);

                if (error) throw error;

                // 4. Switch to Reveal Screen on Success
                showResultScreen(scanTime);

            } catch (err) {
                msg.textContent = "Error: " + err.message;
                captureBtn.disabled = false;
            }

        }, (err) => {
            msg.textContent = "GPS Error: Please enable location";
            captureBtn.disabled = false;
        });
    });

    function showResultScreen(timeStr) {
        scanScreen.classList.remove('active');
        revealScreen.classList.add('active');
        document.getElementById('scanTime').textContent = "Recorded at: " + new Date(timeStr).toLocaleString();
    }

    function resetApp() {
        revealScreen.classList.remove('active');
        scanScreen.classList.add('active');
        captureBtn.disabled = false;
        msg.textContent = "Ready to scan note...";
    }
</script>
</body>
</html>
